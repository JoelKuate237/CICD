# ============================================================
# FICHIER : .gitlab/ci/deploy.yml
# Configuration du stage "deploy"
# ATTENTION : ce fichier contient les pieges YAML les plus frequents
# Lisez bien les commentaires avant de modifier !
# ============================================================

# JOB : deploy-staging
# Deploiement AUTOMATIQUE sur l'environnement de staging
# Se declenche si tous les tests sont passes
deploy-staging:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  needs:
    - job: build-app
      artifacts: true
    - job: test-unitaire
    - job: test-integration
  script:
    - echo "========================================="
    - echo "  Deploiement STAGING"
    - echo "========================================="
    # PIEGE YAML CRITIQUE :
    # Les lignes contenant " : " (deux-points + espace) DOIVENT
    # etre entourees de guillemets simples 'comme ceci'
    # Sinon YAML les interprete comme un mapping cle/valeur
    # et GitLab renvoie : "script config should be a string or a nested array of strings"
    - 'echo "Application : $APP_NAME"'
    - 'echo "Commit : $CI_COMMIT_SHORT_SHA"'
    - 'echo "Branche : $CI_COMMIT_BRANCH"'
    - ls -la dist/
    - echo "Deploiement staging termine"
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

# JOB : deploy-production
# Deploiement MANUEL sur la production
# Necessite un clic sur le bouton play dans l'interface GitLab
deploy-production:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  needs:
    - job: build-app
      artifacts: true
    - job: deploy-staging
  script:
    - echo "========================================="
    - echo "  Deploiement PRODUCTION"
    - echo "========================================="
    # Meme piege : guillemets simples obligatoires
    - 'echo "Application : $APP_NAME"'
    - 'echo "Commit : $CI_COMMIT_SHORT_SHA"'
    - ls -la dist/
    - echo "Deploiement production termine"
  environment:
    name: production
    url: https://production.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual          # declenchement manuel obligatoire
      allow_failure: false  # si le deploy echoue, le pipeline est en erreur

# JOB : rollback-production
# Retour arriere MANUEL en cas de probleme en production
rollback-production:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  script:
    - echo "========================================="
    - echo "  Rollback PRODUCTION"
    - echo "========================================="
    - echo "Rollback vers la version precedente"
    - echo "Rollback termine"
  environment:
    name: production
    # PIEGE YAML : ne JAMAIS mettre "action: rollback"
    # Les seules valeurs valides sont : start, stop, prepare, verify, access
    # Si on veut un job de rollback, on laisse la cle 'action' non definie
    # (elle vaut 'start' par defaut, ce qui convient)
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
