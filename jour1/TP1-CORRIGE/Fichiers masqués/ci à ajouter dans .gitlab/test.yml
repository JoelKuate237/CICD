# ============================================================
# FICHIER : .gitlab/ci/test.yml
# Configuration du stage "test"
# ============================================================

# TEMPLATE reutilisable pour les jobs de test
.base-test:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - echo "Preparation des tests..."
    - echo "Node.js $(node --version)"
    - npm ci --cache .npm --prefer-offline
  cache:
    key: "node-${CI_COMMIT_REF_SLUG}"
    # policy: pull signifie "lit le cache mais n'ecrit pas dedans"
    # Plus rapide car les jobs de test n'ajoutent pas de nouvelles dependances
    policy: pull
    paths:
      - .npm/
      - node_modules/

# JOB : test-unitaire
# Teste les fonctions pures de src/utils.js
test-unitaire:
  extends: .base-test
  stage: test
  script:
    - echo "========================================="
    - echo "  Tests Unitaires"
    - echo "========================================="
    - npx jest tests/utils.test.js --verbose --coverage
    - echo "Tous les tests unitaires sont passes"
  artifacts:
    # when: always garde les rapports meme si les tests echouent
    # (utile pour debugger quand un test casse)
    when: always
    paths:
      - coverage/
    expire_in: 7 days

# JOB : test-integration
# Teste l'API Express via supertest
test-integration:
  extends: .base-test
  stage: test
  # needs : ce job a besoin des artifacts de build-app
  # Sans cette ligne, on n'aurait pas acces au dossier dist/
  needs:
    - job: build-app
      artifacts: true
  script:
    - echo "========================================="
    - echo "  Tests d'Integration"
    - echo "========================================="
    - echo "Verification des artifacts du build..."
    - ls -la dist/
    - npx jest tests/api.test.js --verbose
    - echo "Tous les tests d'integration sont passes"
  # Retry : relance automatique en cas d'echec systeme
  # (utile contre les soucis reseau ou de runner GitLab)
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
