# ============================================================
# FICHIER : .gitlab-ci.yml (racine du projet)
# Pipeline CI/CD multi-stages pour le TP1
# ============================================================

# Variables globales : accessibles dans TOUS les jobs
# On les centralise ici pour ne modifier qu'un seul endroit si besoin
variables:
  NODE_VERSION: "18"
  APP_NAME: "projet-demo-cicd"

# Stages : ordre d'execution des etapes du pipeline
# Chaque stage doit etre completement termine avant que le suivant commence
stages:
  - build
  - test
  - deploy

# Inclusion des fichiers externes
# Permet de separer la configuration en plusieurs fichiers pour plus de clarte
include:
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/deploy.yml

# Workflow : definit QUAND le pipeline doit se declencher
# Evite de lancer des pipelines inutiles sur chaque commit de chaque branche
workflow:
  rules:
    # Declencher sur les merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Declencher sur la branche par defaut (main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Declencher sur les tags (pour les releases)
    - if: '$CI_COMMIT_TAG'
